
name: Azure OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  azure-oidc-test:
    name: Verify Azure OIDC Login
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription
        run: |
          az account show \
            --query '{Subscription:name,SubscriptionId:id,TenantId:tenantId}' \
            --output table

      - name: Verify resource group read access
        run: |
          az group show \
            --name rg-azure-devops-lab-dev \
            --query '{Name:name,Location:location}' \
            --output table
